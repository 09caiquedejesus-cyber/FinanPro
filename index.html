<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto padrão</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        .nav-link {
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #ffffff !important;
            transform: scale(1.01);
            opacity: 0.8;
        }
    </style>

</head>

<body>
    <nav class="navbar navbar-expand-lg bg-warning navbar-dark">
        <div class="container">
            <!-- Logo -->

            <a class="navbar-brand" href="#">
                <img src="img/logo.png" alt="Logo" width="140">
            </a>

            <!-- Botão Hambúrguer -->

            <button class="navbar-toggler border-white" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuNavbar" aria-controls="menuNavbar" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse" id="menuNavbar">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-black fw-semibold" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-black fw-semibold" href="#">Recursos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-black fw-semibold" href="#">Benefícios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-black fw-semibold" href="#">Preços</a>
                    </li>
                </ul>
                <!-- Botão Entrar -->

                <a href="#" class="btn btn-outline-light fw-semibold"> Entrar </a>
            </div>
        </div>
    </nav>


    <!-- inicio da section/ topo / -->
    <section class="bg-warning">
        <div class="container">
            <div class="row align-items-center ">

                <!-- Conteúdo da esquerda -->

                <div class="col-lg-6 text-white">

                    <h1 class="display-4 fw-bold py-3"> Suas contas descomplicadas </h1>

                    <p class="lead py-3"> Usado por mais de 1 milhão de pessoas, o Finans é uma ferramenta online que
                        vai
                        facilitar sua vida financeira. </p>

                    <!-- E-mail + botão -->

                    <div class="input-group mb-4">

                        <input type="email" class="form-control" placeholder="Digite seu e-mail">

                        <button class="btn btn-primary" type="button">
                            Cadastre-se
                        </button>
                    </div>
                    <!-- Disponível para -->

                    <p class="mb-2"> Disponível para </p>

                    <div class="d-flex gap-2 align-items-center">
                        <button class="btn btn-outline-light">
                            <i class="bi bi-android2 text-black"></i>
                        </button>

                        <button class="btn btn-outline-light">
                            <i class="bi bi-apple text-black"></i>
                        </button>

                    </div>
                </div>
                <!-- Imagem da direita -->

                <div class="col-lg-6 text-center mt-4 mt-lg-0">
                    <img src="img/capa-mulher.png" alt="Imagem do aplicativo" class="img-fluid">
                </div>
            </div>
        </div>
    </section><!--fim da sectio topo/ capa / hero-->


    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
